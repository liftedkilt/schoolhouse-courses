name: ck_scale_half
skill: ck_scale_half
params:
  amt: { fraction: { wholes: [0, 3], dens: [2, 3, 4] }, d1: { fraction: { wholes: [0, 2], dens: [2, 4] } } }
  ing: { pick: [flour, milk, sugar, oats, rice, water] }
let:
  unit: "if(amt <= 1, 'cup', 'cups')"
  result: amt / 2
  ans_unit: "if(amt / 2 <= 1, 'cup', 'cups')"
statement:
  kind: statement.word@1
  template: halve
  text: "A recipe uses {amt} {unit} of {ing}. You make half the recipe. How much {ing} do you need?"
  instruction: "Give the amount in cups."
  quantities: [amt]
answer:
  kind: answer.numeric@1
  value: result
  allow_mixed: true
  allow_improper: true
  prefer_lowest_terms: true
  units: [cup, cups]
mistakes:
  - { tag: halved_denominator, value: amt * 2 }
  - { tag: halved_whole_only, value: "whole(amt) / 2 + frac(amt)" }
steps:
  - { kind: ck_scale_halve, working: "{amt} × 1/2 = {answer}", result: result, words: [amt, ing, ans_unit] }
examples:
  - { amt: "2 1/3", ing: oats }
