name: ck_scale_whole
skill: ck_scale_whole
params:
  k: { pick: ["2", "3"] }
  amt: { fraction: { wholes: [0, 2], dens: [2, 3, 4] }, d1: { fraction: { wholes: [0, 1], dens: [2, 4] } } }
  ing: { pick: [flour, milk, sugar, oats, rice, water] }
let:
  how: "if(k == 2, 'double', 'triple')"
  unit: "if(amt <= 1, 'cup', 'cups')"
  result: amt * k
  ans_unit: "if(amt * k <= 1, 'cup', 'cups')"
statement:
  kind: statement.word@1
  template: double_triple
  text: "A recipe uses {amt} {unit} of {ing}. You {how} the recipe, making {k} times as much. How much {ing} do you need?"
  instruction: "Give the amount in cups."
  quantities: [amt, k]
answer:
  kind: answer.numeric@1
  value: result
  allow_mixed: true
  allow_improper: true
  prefer_lowest_terms: true
  units: [cup, cups]
mistakes:
  - { tag: multiplied_both_terms, value: amt }
  - { tag: doubled_whole_only, value: "whole(amt) * k + frac(amt)" }
steps:
  - { kind: ck_scale_times, working: "{amt} × {k} = {answer}", result: result, values: [k], words: [amt, ing, ans_unit] }
examples:
  - { k: "2", amt: "1 3/4", ing: flour }
