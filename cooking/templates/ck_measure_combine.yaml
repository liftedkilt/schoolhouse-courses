name: ck_measure_combine
skill: ck_measure_combine
params:
  scoop: { pick: ["1/2", "1/3", "1/4", "1/8"], d1: { pick: ["1/2", "1/4"] } }
  n: { int: [3, 12] }
where:
  - frac(n * scoop) != 0
let:
  total: n * scoop
statement:
  kind: statement.word@1
  template: scoops
  text: "You only have a {scoop}-cup measure. How many scoops of it make {total} cups?"
  instruction: "Give the number of scoops."
  quantities: [scoop, total]
answer:
  kind: answer.numeric@1
  value: n
mistakes:
  - { tag: multiplied_instead, value: "total * scoop" }
steps:
  - { kind: ck_scoops_divide, working: "{total} ÷ {scoop} = {answer}", result: n, words: [total, scoop] }
examples:
  - { scoop: "1/4", n: "6" }
