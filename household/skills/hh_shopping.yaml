  intro_source: own
- id: hh_change_making
  title: Work out change from a payment
  name: Making change
  course: household
  unit: hh_shopping
  grade: 5-6
  status: live
  prerequisites:
  - hh_unit_price
  generator: hh_change_making
  example_count: 1
  answer_form: money
  misconceptions:
