skills:
- id: hh_loan_simple_total
  title: Find the total repaid on a simple-interest loan
  name: Simple-interest loan
  course: household
  unit: hh_credit
  grade: '7'
  status: live
  prerequisites:
  - hh_budget_percent
  generator: hh_loan_simple_total
  example_count: 1
  answer_form: money
  misconceptions:
  - interest_only
  - one_year_only
  interference: interest_kinds
  calculator: allowed
  intro: 'Simple interest is the same each year: the rate times the amount borrowed. You repay the amount borrowed plus all the interest.'
  intro_source: own
- id: hh_compound_interest
  title: Grow savings with interest compounded once a year
  name: Compound interest
  course: household
  unit: hh_credit
  grade: '8'
  status: live
  prerequisites:
  - hh_loan_simple_total
  generator: hh_compound_interest
  example_count: 1
  answer_form: money, to the cent
  misconceptions:
  - used_simple_interest
  interference: interest_kinds
  calculator: allowed
  intro: With compound interest, each year's interest is added to the balance, and next year's interest is worked out on the new, bigger balance.
  intro_source: own
