name: hh_budget_balance
skill: hh_budget_balance
params:
  income: { int: [36, 90] }
  rent: { int: [70, 140] }
  car: { int: [12, 50] }
  phone: { decimal: { range: ["60.00", "240.00"], step: "0.50" } }
  food: { int: [24, 90] }
where:
  - income * 50 - rent * 10 - car * 10 - phone - food * 5 > 50
let:
  inc: income * 50
  rent_d: rent * 10
  car_d: car * 10
  food_d: food * 5
  spent: rent_d + car_d + phone + food_d
  left: inc - spent
statement:
  kind: statement.word@1
  template: budget_left
  text: "Monthly income is {inc|money}. Rent is {rent_d|money}, the car is {car_d|money}, phone and internet are {phone|money}, and food is {food_d|money}. How much is left?"
  instruction: "Give the amount in dollars and cents."
  quantities: [inc, rent_d, car_d, phone, food_d]
answer:
  kind: answer.numeric@1
  value: left
  money: true
mistakes:
  - { tag: missed_an_expense, value: left + food_d }
steps:
  - { kind: hh_bal_spent, working: "{rent_d|money} + {car_d|money} + {phone|money} + {food_d|money} = {spent|money}", result: spent, words: ["rent_d|money", "car_d|money", "phone|money", "food_d|money", "spent|money"] }
  - { kind: hh_bal_left, working: "{inc|money} − {spent|money} = {answer|money}", result: left, words: ["inc|money", "spent|money", "answer|money"] }
examples:
  - { income: "43", rent: "95", car: "32", phone: "185.50", food: "48" }
