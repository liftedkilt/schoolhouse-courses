name: hh_paint_gallons
skill: hh_paint_gallons
params:
  len: { int: [9, 18] }
  wid: { int: [8, 16] }
  ht: { pick: ["8", "9"] }
  windows: { int: [1, 3] }
  cover: { pick: ["300", "350", "400"] }
where:
  - frac(round((2 * len * ht + 2 * wid * ht - 21 - 15 * windows) * 2 / cover, 1/100)) != 0
  - len != wid
  - ceil((2 * len * ht + 2 * wid * ht - 21 - 15 * windows) * 2 / cover) != ceil((2 * len * ht + 2 * wid * ht - 21 - 15 * windows) / cover)
let:
  walls: 2 * len * ht + 2 * wid * ht
  holes: 21 + 15 * windows
  paint: walls - holes
  coats: paint * 2
  exact: coats / cover
  cans: ceil(exact)
  approx: round(exact, 1/100)
  cans_less: floor(exact)
  wword: "if(windows == 1, 'window', 'windows')"
statement:
  kind: statement.word@1
  template: paint
  text: "A room is {len} ft by {wid} ft with walls {ht} ft high. Leave out one door (21 sq ft) and {windows} {wword} (15 sq ft each). You paint two coats, and a gallon covers {cover} sq ft. How many gallons do you buy?"
  instruction: "Give a whole number of gallons."
  quantities: [len, wid, ht, windows, cover]
answer:
  kind: answer.count@1
  value: exact
  round: up
  units: [gallons, gallon]
mistakes:
  - { tag: one_coat, value: ceil(paint / cover) }
  - { tag: forgot_openings, value: ceil(walls * 2 / cover) }
steps:
  - { kind: hh_paint_walls, working: "2 × {len} × {ht} + 2 × {wid} × {ht} = {walls}", result: walls, values: [len, wid, ht, walls] }
  - { kind: hh_paint_holes, working: "{walls} − {holes} = {paint}", result: paint, values: [walls, holes, paint] }
  - { kind: hh_paint_coats, working: "{paint} × 2 ÷ {cover} ≈ {approx|dec}", result: exact, values: [paint, cover], words: ["approx|dec"] }
  - { kind: hh_paint_round, working: "{approx|dec} → {cans} gallons", result: cans, words: ["approx|dec", cans_less] }
examples:
  - { len: "12", wid: "10", ht: "8", windows: "3", cover: "350" }
