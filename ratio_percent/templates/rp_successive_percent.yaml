name: rp_successive_percent
skill: rp_successive_percent
params:
  price: { pick: ["40", "50", "60", "80", "100", "120", "150", "200"] }
  a: { pick: ["10", "20", "25", "30", "40", "50"] }
  b: { pick: ["10", "20", "25", "50"] }
where:
  - den(price * (100 - a) / 100 * (100 - b) / 100 * 100) == 1
  - a != b
let:
  first: price * (1 - pct(a))
statement:
  kind: statement.word@1
  template: two_discounts
  text: "A ${price} item is marked {a}% off, then a further {b}% off the sale price. What is the final price?"
  instruction: "Give the price in dollars and cents."
  quantities: [price, a, b]
answer:
  kind: answer.numeric@1
  value: first * (1 - pct(b))
  money: true
mistakes:
  - { tag: added_percents, value: "price * (1 - pct(a + b))" }
steps:
  - { kind: rp_two_first, working: "${price} − {a}% = {first|money}", result: first, values: [price, a], words: ["first|money"] }
  - { kind: rp_two_second, working: "{first|money} − {b}% = {answer|money}", result: first * (1 - pct(b)), values: [b], words: ["first|money", "answer|money"] }
examples:
  - { price: "50", a: "20", b: "10" }
