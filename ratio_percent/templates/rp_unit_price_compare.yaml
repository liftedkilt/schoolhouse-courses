name: rp_unit_price_compare
skill: rp_unit_price_compare
params:
  small: { int: [8, 24] }
  big: { int: [28, 64] }
  small_each: { decimal: { range: ["0.10", "0.40"], step: "0.01" } }
  big_each: { decimal: { range: ["0.10", "0.40"], step: "0.01" } }
where:
  - big_each != small_each
  - big * big_each > small * small_each
let:
  small_price: small * small_each
  big_price: big * big_each
  better: "if(small_each < big_each, small, big)"
  cheaper: "if(small_each < big_each, 'small', 'big')"
statement:
  kind: statement.word@1
  template: better_buy
  text: "Which is the better buy: {small} ounces for {small_price|money} or {big} ounces for {big_price|money}?"
  instruction: "Choose the size."
  quantities: [small, small_price, big, big_price]
answer:
  kind: answer.choice@1
  value: "join(' ', better, 'ounces')"
  options: ["join(' ', small, 'ounces')", "join(' ', big, 'ounces')"]
mistakes:
  - { tag: chose_lower_total, value: "join(' ', small, 'ounces')" }
steps:
  - { kind: rp_compare_unit_prices, working: "{small_price|money} ÷ {small} = {small_each|money} and {big_price|money} ÷ {big} = {big_each|money}", result: "join(' ', better, 'ounces')", values: [better], words: ["small_each|money", "big_each|money", cheaper] }
# Both sizes are in the question; picking one shows a number of the question.
# The mistake (the lower total) is dropped on problems where the small size wins.
example_allow: [answer]
examples:
  - { small: "12", big: "20", small_each: "0.25", big_each: "0.22" }
