    title: "Find the total with sales tax"
    name: "Sales tax"
    course: ratio_percent
    unit: rp_money
    grade: "7"
    status: live
    prerequisites: [rp_percent_increase_decrease]
    generator: rp_sales_tax
    example_count: 1
    answer_form: "money"
    interference: rp_money_percent
