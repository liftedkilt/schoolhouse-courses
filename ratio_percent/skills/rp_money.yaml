    intro_source: own
  - id: rp_discount_price
    title: "Find a sale price"
    name: "Sale prices"
    course: ratio_percent
    unit: rp_money
    grade: "7"
    status: live
    prerequisites: [rp_percent_increase_decrease]
    generator: rp_discount_price
    example_count: 1
